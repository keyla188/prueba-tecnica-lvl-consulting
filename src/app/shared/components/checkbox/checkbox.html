<button
  type="button"
  role="checkbox"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel() || null"
  [disabled]="disabled()"
  (click)="toggle()"
  class="flex h-5 w-5 shrink-0 items-center justify-center rounded-md border transition-colors disabled:cursor-not-allowed disabled:opacity-40"
  [class]="checked() ? 'border-primary bg-primary' : 'border-border bg-surface'"
>
  @if (checked()) {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
      <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  }
</button>
