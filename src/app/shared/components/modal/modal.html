@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-[#222222]/50" (click)="onBackdropClick()"></div>

    <div class="relative z-10 flex max-h-[90vh] w-full max-w-lg flex-col overflow-hidden rounded-2xl bg-surface shadow-2xl">
      <div class="flex items-center justify-between border-b border-border bg-sidebar px-6 py-4">
        <h2 class="text-lg font-bold text-primary">{{ title() }}</h2>

        <button type="button" (click)="onCloseClick()" class="text-text-muted" aria-label="Cerrar">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <div class="overflow-y-auto p-6">
        <ng-content />
      </div>
    </div>
  </div>
}
