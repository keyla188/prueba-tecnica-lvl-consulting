<button
  type="button"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel() || null"
  [disabled]="disabled()"
  (click)="toggle()"
  class="relative inline-flex h-7 w-14 shrink-0 cursor-pointer items-center rounded-full bg-border transition-colors disabled:cursor-not-allowed disabled:opacity-40"
>
  <span
    class="inline-block h-6 w-6 transform rounded-full shadow transition-transform"
    [class]="checked() ? 'bg-primary translate-x-7' : 'bg-[#9CA3AF] translate-x-1'"
  ></span>
</button>
